<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Manish Paudel — full-stack developer</title>
  <desc id="description">A dark, refined profile banner with soft blue, purple, and coral gradients.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10131B"/>
      <stop offset="1" stop-color="#18131E"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(220 50) rotate(38) scale(510 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity=".72"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="0" cy="0" r="1" gradientTransform="translate(1120 370) rotate(-143) scale(560 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185" stop-opacity=".60"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="908" y1="57" x2="1122" y2="263" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8B4FE"/>
      <stop offset=".52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="blur" x="-120" y="-120" width="1520" height="660" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#background)"/>
  <g filter="url(#blur)">
    <ellipse cx="220" cy="50" rx="400" ry="255" fill="url(#blueGlow)"/>
    <ellipse cx="1120" cy="370" rx="400" ry="255" fill="url(#coralGlow)"/>
  </g>
  <circle cx="1017" cy="160" r="106" fill="url(#orb)" fill-opacity=".88"/>
  <circle cx="1017" cy="160" r="78" fill="#111827" fill-opacity=".15"/>
  <path d="M1099 254C1140 222 1171 176 1181 122" stroke="white" stroke-opacity=".26" stroke-width="2" stroke-linecap="round"/>
  <path d="M85 82H151" stroke="white" stroke-opacity=".54" stroke-width="3" stroke-linecap="round"/>
  <text x="85" y="140" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Manish Paudel</text>
  <text x="89" y="191" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Full-stack developer · Founder at StupidGames-MC</text>
  <rect x="85" y="245" width="258" height="42" rx="21" fill="white" fill-opacity=".12" stroke="white" stroke-opacity=".18"/>
  <circle cx="109" cy="266" r="6" fill="#86EFAC"/>
  <text x="125" y="272" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Open to great projects</text>
  <text x="89" y="358" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.8">BUILD · CONNECT · AUTOMATE · CREATE</text>
</svg>
