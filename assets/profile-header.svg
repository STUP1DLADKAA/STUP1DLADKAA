<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Manish Paudel — full-stack developer</title>
  <desc id="description">An animated, refined profile banner with soft blue, violet, and coral light.</desc>
  <style>
    .float { animation: float 7s ease-in-out infinite; transform-origin: center; }
    .drift { animation: drift 12s ease-in-out infinite alternate; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
    .draw { stroke-dasharray: 220; animation: draw 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-14px) rotate(5deg); } }
    @keyframes drift { 100% { transform: translate(38px, -22px); } }
    @keyframes pulse { 50% { opacity: .38; transform: scale(1.55); } }
    @keyframes draw { 50% { stroke-dashoffset: 220; opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { .float, .drift, .pulse, .draw { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0D14"/><stop offset=".52" stop-color="#131522"/><stop offset="1" stop-color="#17101B"/>
    </linearGradient>
    <radialGradient id="blue" cx="0" cy="0" r="1" gradientTransform="translate(210 35) rotate(39) scale(530 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity=".74"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0" cy="0" r="1" gradientTransform="translate(1100 387) rotate(-142) scale(530 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6" stop-opacity=".58"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="886" y1="48" x2="1123" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9D5FF"/><stop offset=".48" stop-color="#A78BFA"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="blur" x="-140" y="-140" width="1560" height="720" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="shadow" x="830" y="5" width="360" height="360" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1280" height="440" rx="30" fill="url(#bg)"/>
  <g filter="url(#blur)" class="drift"><ellipse cx="210" cy="35" rx="430" ry="255" fill="url(#blue)"/><ellipse cx="1100" cy="387" rx="410" ry="245" fill="url(#pink)"/></g>
  <g opacity=".42"><path d="M736 93C821 57 868 92 940 67C1011 42 1074 61 1180 27" class="draw" stroke="#E0E7FF" stroke-width="1.5" stroke-linecap="round"/><circle cx="736" cy="93" r="3" fill="#E0E7FF"/><circle cx="1180" cy="27" r="3" fill="#E0E7FF"/></g>
  <g filter="url(#shadow)" class="float"><circle cx="1015" cy="176" r="113" fill="url(#orb)" fill-opacity=".92"/><circle cx="1015" cy="176" r="81" fill="#111827" fill-opacity=".13"/><path d="M1096 273C1140 235 1165 181 1171 120" stroke="white" stroke-opacity=".32" stroke-width="2" stroke-linecap="round"/></g>
  <circle cx="108" cy="286" r="15" fill="#86EFAC" fill-opacity=".2" class="pulse"/><circle cx="108" cy="286" r="6" fill="#86EFAC"/>
  <path d="M86 78H150" stroke="white" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <text x="85" y="140" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Manish Paudel</text>
  <text x="89" y="190" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="22">Full-stack developer · Founder at StupidGames-MC</text>
  <text x="125" y="292" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Open to thoughtful projects</text>
  <text x="89" y="374" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">BUILD · CONNECT · AUTOMATE · CREATE</text>
</svg>
